name: Repair authentication flow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[auth-repair]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove fragile redirect dependency from email auth
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          s2 = s.replace(",emailRedirectTo:location.origin+location.pathname", "")
          s2 = s2.replace(",{redirectTo:location.origin+location.pathname}", "")
          if s2 != s:
              p.write_text(s2, encoding="utf-8")
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix authentication redirect dependency [auth-repair]"
          git push
