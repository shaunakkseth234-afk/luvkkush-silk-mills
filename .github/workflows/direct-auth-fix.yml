name: Direct authentication fallback

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append direct authentication handlers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- direct-auth-fix-v2 -->'
          if marker not in s:
              patch = r'''<script>
          /* direct-auth-fix-v2: bypass the unavailable Edge Function gateway */
          async function signup(){
            const n=$("rn").value.trim(),cc=$("rcc").value,p=$("rp").value.replace(/\D/g,"").trim(),e=$("re").value.trim().toLowerCase(),w=$("rw").value;
            if(!n||!p||!e||!w)return msg("rm","Please complete all fields.");
            if(w.length<6)return msg("rm","Password must be at least 6 characters.");
            const phoneE164=cc+p;
            try{
              const result=await sb.auth.signUp({email:e,password:w,options:{data:{full_name:n,phone:p,country_code:cc,phone_e164:phoneE164}}});
              if(result.error)return msg("rm","Registration failed: "+result.error.message);
              if(result.data?.session&&result.data?.user){await start(result.data.user);return;}
              msg("rm","Account created. Check your email for confirmation, then sign in.",true);
              back();
            }catch(err){console.error(err);msg("rm","Registration failed: "+(err?.message||"Unable to reach Supabase Auth."));}
          }
          async function login(){
            const e=$("email").value.trim().toLowerCase(),p=$("password").value;
            if(!e||!p)return msg("am","Enter your email and password.");
            try{
              const result=await sb.auth.signInWithPassword({email:e,password:p});
              if(result.error)return msg("am","Login failed: "+result.error.message);
              if(!result.data?.user)return msg("am","Login failed: no user was returned.");
              await start(result.data.user);
            }catch(err){console.error(err);msg("am","Login failed: "+(err?.message||"Unable to reach Supabase Auth."));}
          }
          </script>
          <!-- direct-auth-fix-v2 -->'''
              s = s.replace('</body>', patch + '</body>')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit direct authentication fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use direct Supabase Auth for registration and login"
          git push
